<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMT Level II Sample Exam</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Exam Selection Screen -->
        <div id="examSelection" class="exam-selection">
            <h1>CMT Level II Sample Exam</h1>
            <h2>Select an Exam</h2>
            <div class="exam-options">
                <button class="exam-option-btn" onclick="showSectionSelection(1)">
                    <h3>Exam 1</h3>
                    <p>150 Questions | 3 Hours</p>
                </button>
                <button class="exam-option-btn" onclick="showSectionSelection(2)">
                    <h3>Exam 2</h3>
                    <p>150 Questions | 3 Hours</p>
                </button>
            </div>
        </div>

        <!-- Section Selection Screen -->
        <div id="sectionSelection" class="section-selection" style="display: none;">
            <h1>CMT Level II Sample Exam <span id="sectionExamNumber"></span></h1>
            <h2>Select a Section or Full Exam</h2>
            <button class="back-btn" onclick="backToExamSelection()">← Back to Exam Selection</button>
            <div id="sectionOptions" class="section-options">
                <!-- Sections will be dynamically loaded here -->
            </div>
        </div>

        <!-- Exam Container (hidden initially) -->
        <div id="examWrapper" style="display: none;">
            <header>
                <h1>CMT Level II Sample Exam <span id="examNumber"></span></h1>
                <div class="exam-info">
                    <p><strong>Total Questions:</strong> 150</p>
                    <p><strong>Time Limit:</strong> 3 hours</p>
                    <p id="timer">Time Remaining: 03:00:00</p>
                </div>
                <button id="clearProgressBtn" class="clear-progress-btn" title="Clear saved progress and start fresh">Clear Progress</button>
            </header>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <p class="progress-text" id="progressText">Question 1 of 150</p>
            <button id="toggleNavigatorBtn" class="toggle-nav-btn">Show Questions</button>
        </div>

        <div id="questionNavigator" class="question-navigator hidden">
            <h3>Question Navigator</h3>
            <div class="navigator-legend">
                <span><span class="legend-box current"></span> Current</span>
                <span><span class="legend-box answered"></span> Answered</span>
                <span><span class="legend-box flagged"></span> Flagged</span>
                <span><span class="legend-box unanswered"></span> Unanswered</span>
            </div>
            <!-- Question grid will be generated by JavaScript -->
        </div>

        <main id="examContainer">
            <!-- Questions will be loaded here by JavaScript -->
        </main>

        <div class="navigation">
            <button id="prevBtn" class="nav-btn" disabled>Previous</button>
            <button id="nextBtn" class="nav-btn">Next</button>
            <button id="submitBtn" class="submit-btn" style="display:none;">Submit Exam</button>
        </div>

        <div id="resultsModal" class="modal">
            <div class="modal-content">
                <h2>Exam Results</h2>
                <div id="resultsContent"></div>
                <button id="reviewBtn" class="btn">Review Answers</button>
                <button id="restartBtn" class="btn">Restart Exam</button>
            </div>
        </div>
        </div>
    </div>

    <script src="sections_config.js"></script>
    <script>
        let currentExamNum = null;

        // Show section selection screen
        function showSectionSelection(examNum) {
            currentExamNum = examNum;

            // Hide exam selection screen
            document.getElementById('examSelection').style.display = 'none';

            // Show section selection screen
            document.getElementById('sectionSelection').style.display = 'block';

            // Update exam number in header
            document.getElementById('sectionExamNumber').textContent = `(Exam ${examNum})`;

            // Load sections for this exam
            loadSections(examNum);
        }

        // Load sections dynamically
        function loadSections(examNum) {
            const sectionOptionsDiv = document.getElementById('sectionOptions');
            sectionOptionsDiv.innerHTML = '';

            // Add Full Exam option
            const fullExamBtn = document.createElement('button');
            fullExamBtn.className = 'section-option-btn full-exam-btn';
            fullExamBtn.onclick = () => selectExam(examNum, null);
            fullExamBtn.innerHTML = `
                <h3>Full Exam</h3>
                <p>150 Questions | 3 Hours</p>
                <span class="section-tag">Complete Exam</span>
            `;
            sectionOptionsDiv.appendChild(fullExamBtn);

            // Add section options
            const sections = examSections[examNum] || [];
            sections.forEach(section => {
                const sectionBtn = document.createElement('button');
                sectionBtn.className = 'section-option-btn';
                sectionBtn.onclick = () => selectExam(examNum, section);
                sectionBtn.innerHTML = `
                    <h3>${section.title}</h3>
                    <p>${section.description}</p>
                    <span class="section-tag">Section Practice</span>
                `;
                sectionOptionsDiv.appendChild(sectionBtn);
            });
        }

        // Back to exam selection
        function backToExamSelection() {
            document.getElementById('sectionSelection').style.display = 'none';
            document.getElementById('examSelection').style.display = 'block';
        }

        // Exam selection handler
        function selectExam(examNum, section) {
            // Store selected exam and section
            sessionStorage.setItem('selectedExam', examNum);
            if (section) {
                sessionStorage.setItem('selectedSection', JSON.stringify(section));
            } else {
                sessionStorage.removeItem('selectedSection');
            }

            // Hide selection screens
            document.getElementById('examSelection').style.display = 'none';
            document.getElementById('sectionSelection').style.display = 'none';

            // Show exam wrapper
            document.getElementById('examWrapper').style.display = 'block';

            // Update exam number in header
            let headerText = `(Exam ${examNum}`;
            if (section) {
                headerText += ` - ${section.title}`;
            }
            headerText += ')';
            document.getElementById('examNumber').textContent = headerText;

            // Update exam info for sections
            if (section) {
                document.querySelector('.exam-info p:first-child strong').nextSibling.textContent = ` ${section.questionCount}`;
                document.getElementById('timer').style.display = 'none'; // Hide timer for sections
            }

            // Load appropriate questions file
            const script = document.createElement('script');
            if (section) {
                script.src = section.file;
            } else {
                script.src = examNum === 1 ? 'questions.js' : 'questions_2.js';
            }
            script.onload = function() {
                // Load exam.js after questions are loaded
                const examScript = document.createElement('script');
                examScript.src = 'exam.js';
                document.body.appendChild(examScript);
            };
            document.body.appendChild(script);
        }

        // Check if exam was already selected (for page reloads)
        window.addEventListener('DOMContentLoaded', function() {
            const selectedExam = sessionStorage.getItem('selectedExam');
            const selectedSection = sessionStorage.getItem('selectedSection');

            if (selectedExam) {
                const examNum = parseInt(selectedExam);
                const section = selectedSection ? JSON.parse(selectedSection) : null;
                selectExam(examNum, section);
            }
        });
    </script>
</body>
</html>
