<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMT Level II Sample Exam</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Main Selection Screen -->
        <div id="mainSelection" class="main-selection">
            <h1>CMT Level II Sample Exam</h1>

            <!-- Full Exams Section -->
            <div class="selection-category">
                <h2>Full Exams</h2>
                <div class="exam-options">
                    <button class="exam-option-btn full-exam-btn" onclick="selectExam(1, null)">
                        <h3>Exam 1</h3>
                        <p>150 Questions | 3 Hours</p>
                        <span class="exam-tag">Complete Exam</span>
                    </button>
                    <button class="exam-option-btn full-exam-btn" onclick="selectExam(2, null)">
                        <h3>Exam 2</h3>
                        <p>150 Questions | 3 Hours</p>
                        <span class="exam-tag">Complete Exam</span>
                    </button>
                </div>
            </div>

            <!-- Section Practice Section -->
            <div class="selection-category">
                <h2>Section-wise Practice</h2>
                <div class="section-grid">
                    <!-- Exam 1 Sections -->
                    <div class="exam-sections">
                        <h3 class="exam-subtitle">Exam 1 Sections</h3>
                        <div id="exam1Sections" class="section-options">
                            <!-- Will be loaded dynamically -->
                        </div>
                    </div>
                    <!-- Exam 2 Sections -->
                    <div class="exam-sections">
                        <h3 class="exam-subtitle">Exam 2 Sections</h3>
                        <div id="exam2Sections" class="section-options">
                            <!-- Will be loaded dynamically -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Exam Container (hidden initially) -->
        <div id="examWrapper" style="display: none;">
            <header>
                <div class="header-nav">
                    <button id="homeBtn" class="nav-home-btn" onclick="goHome()" title="Return to main menu">
                        🏠 Home
                    </button>
                    <button id="backBtn" class="nav-back-btn" onclick="goBack()" title="Go back" style="display: none;">
                        ← Back
                    </button>
                </div>
                <h1>CMT Level II Sample Exam <span id="examNumber"></span></h1>
                <div class="exam-info">
                    <p><strong>Total Questions:</strong> <span id="totalQuestions">150</span></p>
                    <p><strong>Time Limit:</strong> <span id="timeLimit">3 hours</span></p>
                    <p id="timer">Time Remaining: 03:00:00</p>
                </div>
                <button id="clearProgressBtn" class="clear-progress-btn" title="Clear saved progress and start fresh">Clear Progress</button>
            </header>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <p class="progress-text" id="progressText">Question 1 of 150</p>
            <button id="toggleNavigatorBtn" class="toggle-nav-btn">Show Questions</button>
        </div>

        <div id="questionNavigator" class="question-navigator hidden">
            <h3>Question Navigator</h3>
            <div class="navigator-legend">
                <span><span class="legend-box current"></span> Current</span>
                <span><span class="legend-box answered"></span> Answered</span>
                <span><span class="legend-box flagged"></span> Flagged</span>
                <span><span class="legend-box unanswered"></span> Unanswered</span>
            </div>
            <!-- Question grid will be generated by JavaScript -->
        </div>

        <main id="examContainer">
            <!-- Questions will be loaded here by JavaScript -->
        </main>

        <div class="navigation">
            <button id="prevBtn" class="nav-btn" disabled>Previous</button>
            <button id="nextBtn" class="nav-btn">Next</button>
            <button id="submitBtn" class="submit-btn" style="display:none;">Submit Exam</button>
        </div>

        <div id="resultsModal" class="modal">
            <div class="modal-content">
                <h2>Exam Results</h2>
                <div id="resultsContent"></div>
                <button id="reviewBtn" class="btn">Review Answers</button>
                <button id="restartBtn" class="btn">Restart Exam</button>
            </div>
        </div>
        </div>
    </div>

    <script src="sections_config.js"></script>
    <script>
        // Load all sections on page load
        window.addEventListener('DOMContentLoaded', function() {
            console.log('Page loaded');
            console.log('examSections:', window.examSections || examSections);

            loadAllSections();

            // Check if exam was already selected (for page reloads)
            const selectedExam = sessionStorage.getItem('selectedExam');
            const selectedSection = sessionStorage.getItem('selectedSection');

            if (selectedExam) {
                const examNum = parseInt(selectedExam);
                const section = selectedSection ? JSON.parse(selectedSection) : null;
                selectExam(examNum, section);
            }
        });

        // Load all sections for both exams
        function loadAllSections() {
            console.log('Loading sections...');

            // Load Exam 1 sections
            const exam1Container = document.getElementById('exam1Sections');
            const exam1Sections = examSections[1] || [];

            console.log('Exam 1 sections:', exam1Sections);

            if (exam1Sections.length === 0) {
                exam1Container.innerHTML = '<p class="no-sections">No sections available yet</p>';
            } else {
                exam1Sections.forEach(mainSection => {
                    // Create main section header
                    const sectionHeader = document.createElement('div');
                    sectionHeader.className = 'main-section-header';

                    const hasSubsections = mainSection.subsections && mainSection.subsections.length > 0;

                    sectionHeader.innerHTML = `
                        <span class="expand-icon">${hasSubsections ? '▶' : ''}</span>
                        <span class="section-title">${mainSection.title}</span>
                        ${hasSubsections ? `<span class="subsection-count">(${mainSection.subsections.length} topics)</span>` : '<span class="no-topics">(Coming soon)</span>'}
                    `;

                    // Create subsections container
                    const subsectionsContainer = document.createElement('div');
                    subsectionsContainer.className = 'subsections-container collapsed';

                    if (hasSubsections) {
                        mainSection.subsections.forEach(subsection => {
                            const subsectionBtn = document.createElement('button');
                            subsectionBtn.className = 'subsection-btn';
                            subsectionBtn.onclick = () => selectExam(1, subsection);
                            subsectionBtn.innerHTML = `
                                <span class="subsection-title">${subsection.title}</span>
                                <span class="subsection-info">${subsection.description}</span>
                            `;
                            subsectionsContainer.appendChild(subsectionBtn);
                        });

                        // Toggle collapse on header click
                        sectionHeader.onclick = () => {
                            const isCollapsed = subsectionsContainer.classList.contains('collapsed');
                            subsectionsContainer.classList.toggle('collapsed');
                            const icon = sectionHeader.querySelector('.expand-icon');
                            icon.textContent = isCollapsed ? '▼' : '▶';
                        };
                        sectionHeader.style.cursor = 'pointer';
                    }

                    exam1Container.appendChild(sectionHeader);
                    if (hasSubsections) {
                        exam1Container.appendChild(subsectionsContainer);
                    }
                });
            }

            // Load Exam 2 sections
            const exam2Container = document.getElementById('exam2Sections');
            const exam2Sections = examSections[2] || [];

            console.log('Exam 2 sections:', exam2Sections);

            if (exam2Sections.length === 0) {
                exam2Container.innerHTML = '<p class="no-sections">No sections available yet</p>';
            } else {
                exam2Sections.forEach(mainSection => {
                    // Create main section header
                    const sectionHeader = document.createElement('div');
                    sectionHeader.className = 'main-section-header';

                    const hasSubsections = mainSection.subsections && mainSection.subsections.length > 0;

                    sectionHeader.innerHTML = `
                        <span class="expand-icon">${hasSubsections ? '▶' : ''}</span>
                        <span class="section-title">${mainSection.title}</span>
                        ${hasSubsections ? `<span class="subsection-count">(${mainSection.subsections.length} topics)</span>` : '<span class="no-topics">(Coming soon)</span>'}
                    `;

                    // Create subsections container
                    const subsectionsContainer = document.createElement('div');
                    subsectionsContainer.className = 'subsections-container collapsed';

                    if (hasSubsections) {
                        mainSection.subsections.forEach(subsection => {
                            const subsectionBtn = document.createElement('button');
                            subsectionBtn.className = 'subsection-btn';
                            subsectionBtn.onclick = () => selectExam(2, subsection);
                            subsectionBtn.innerHTML = `
                                <span class="subsection-title">${subsection.title}</span>
                                <span class="subsection-info">${subsection.description}</span>
                            `;
                            subsectionsContainer.appendChild(subsectionBtn);
                        });

                        // Toggle collapse on header click
                        sectionHeader.onclick = () => {
                            const isCollapsed = subsectionsContainer.classList.contains('collapsed');
                            subsectionsContainer.classList.toggle('collapsed');
                            const icon = sectionHeader.querySelector('.expand-icon');
                            icon.textContent = isCollapsed ? '▼' : '▶';
                        };
                        sectionHeader.style.cursor = 'pointer';
                    }

                    exam2Container.appendChild(sectionHeader);
                    if (hasSubsections) {
                        exam2Container.appendChild(subsectionsContainer);
                    }
                });
            }
        }

        // Exam selection handler
        function selectExam(examNum, section) {
            // Store selected exam and section
            sessionStorage.setItem('selectedExam', examNum);
            if (section) {
                sessionStorage.setItem('selectedSection', JSON.stringify(section));
            } else {
                sessionStorage.removeItem('selectedSection');
            }

            // Hide main selection screen
            document.getElementById('mainSelection').style.display = 'none';

            // Show exam wrapper
            document.getElementById('examWrapper').style.display = 'block';

            // Update exam number in header
            const headerElement = document.querySelector('#examWrapper header h1');
            if (headerElement) {
                if (section) {
                    headerElement.innerHTML = section.title;
                } else {
                    headerElement.innerHTML = `CMT Level II Sample Exam <span id="examNumber">(Exam ${examNum})</span>`;
                }
            }

            // Update exam info for sections
            if (section) {
                document.getElementById('totalQuestions').textContent = section.questionCount;
                document.getElementById('timeLimit').textContent = 'No time limit';
                document.getElementById('timer').style.display = 'none';
            } else {
                document.getElementById('totalQuestions').textContent = '150';
                document.getElementById('timeLimit').textContent = '3 hours';
                document.getElementById('timer').style.display = 'block';
            }

            // Load appropriate questions file
            const script = document.createElement('script');
            if (section) {
                script.src = section.file;
            } else {
                script.src = examNum === 1 ? 'questions.js' : 'questions_2.js';
            }

            script.onload = function() {
                console.log('Questions file loaded:', script.src);
                console.log('Questions available:', typeof questions !== 'undefined', questions ? questions.length : 0);

                // Load exam.js after questions are loaded
                const examScript = document.createElement('script');
                examScript.src = 'exam.js';
                examScript.onload = function() {
                    console.log('exam.js loaded successfully');
                };
                examScript.onerror = function() {
                    console.error('Failed to load exam.js');
                };
                document.body.appendChild(examScript);
            };

            script.onerror = function() {
                console.error('Failed to load questions file:', script.src);
            };

            document.body.appendChild(script);
        }

        // Go back to main menu
        function goHome() {
            if (confirm('Are you sure you want to return to the main menu? Your progress will be saved.')) {
                // Clear session storage
                sessionStorage.clear();
                // Reload page to reset everything
                window.location.reload();
            }
        }

        // Go back (currently same as home, can be customized)
        function goBack() {
            goHome();
        }
    </script>
</body>
</html>
