<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap"><style>
* { box-sizing:border-box; margin:0; padding:0; }
body { width:400px; background:#000; font-family:"Satoshi",system-ui,sans-serif; color:#fff; }
.hero { position:relative; width:400px; padding:20px 20px 6px; overflow:hidden; }
.bg { position:absolute; inset:0; background:url(../bg.jpg) center 30%/cover; filter:saturate(.7) brightness(.9); }
.shade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.78) 0%, rgba(0,0,0,.9) 45%, #000 100%); }
.hero > *:not(.bg):not(.shade) { position:relative; }
.top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
.top img { height:20px; }
.live { display:flex; align-items:center; gap:7px; border:1.5px solid rgba(214,253,59,.55); border-radius:999px; padding:5px 11px; font-size:11.5px; color:rgba(255,255,255,.8); background:rgba(214,253,59,.06); white-space:nowrap; }
.live b { color:#fff; font-weight:700; }
.dot { width:7px; height:7px; border-radius:50%; background:#d6fd3b; box-shadow:0 0 0 3px rgba(214,253,59,.18), 0 0 10px rgba(214,253,59,.7); }
.lockup { margin-top:23px; display:flex; align-items:center; gap:10px; font-size:17px; font-weight:700; letter-spacing:-.01em; }
.lockup::before { content:""; width:4px; height:18px; border-radius:2px; background:#d6fd3b; }
.lockup em, h1 em { font-style:normal; color:#d6fd3b; }
h1 { margin-top:12px; font-size:42px; font-weight:500; line-height:1.02; letter-spacing:-.04em; }
h1 em { font-weight:700; }
svg { display:block; margin-top:16px; width:360px; height:auto; overflow:visible; }
</style></head>
<body><div class="hero"><div class="bg"></div><div class="shade"></div>
<div class="top"><img src="../logo.png" alt=""><div class="live"><span class="dot"></span>Just launched: <b>fincoursa.com</b></div></div>
<div class="lockup"><span>CMT <em>Level II</em> Question Bank</span></div>
<h1>Less noise.<br><em>More signal.</em></h1>
<svg viewBox="0 14 936 222" fill="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6fd3b" stop-opacity=".22"/><stop offset="1" stop-color="#d6fd3b" stop-opacity="0"/></linearGradient></defs>
    <g stroke="rgba(255,255,255,.07)"><line x1="0" y1="60" x2="936" y2="60"/><line x1="0" y1="130" x2="936" y2="130"/><line x1="0" y1="200" x2="936" y2="200"/></g>
    <path d="M0 185 L20 162 L40 216 L60 148 L80 196 L100 174 L120 141 L140 182 L160 135 L180 168 L200 133 L220 133 L240 157 L260 185 L280 128 L300 133 L320 158 L340 175 L360 147 L380 132 L400 162 L420 107 L440 146 L460 114 L480 105 L500 101 L520 106 L540 122 L560 96 L580 105 L600 103 L620 92 L640 93 L660 79 L680 77 L700 77 L720 81 L740 74 L760 69 L780 68 L800 63 L820 59 L840 58 L860 54 L880 49 L900 46" stroke="rgba(255,255,255,.28)" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M0 206 L300 166 L600 110 L900 46 L900 250 L0 250 Z" fill="url(#g)"/>
    <path d="M0 206 L300 166 L600 110 L900 46" stroke="#d6fd3b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <g font-family="Satoshi, sans-serif" font-size="32" fill="rgba(255,255,255,.62)">
      <text x="10" y="70" fill="rgba(255,255,255,.5)">Noise: scattered notes, forums, guesswork</text>
      <text x="330" y="196" fill="#d6fd3b" font-weight="700">Signal: one curriculum-mapped question bank</text>
      <circle cx="900" cy="46" r="9" fill="#d6fd3b"/><circle cx="900" cy="46" r="18" fill="#d6fd3b" fill-opacity=".18"/>

    </g>
  </svg>
</div></body></html>
