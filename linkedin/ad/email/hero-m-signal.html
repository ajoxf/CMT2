<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap"><style>
* { box-sizing:border-box; margin:0; padding:0; }
body { width:400px; background:#000; font-family:"Satoshi",system-ui,sans-serif; color:#fff; }
.hero { position:relative; width:400px; padding:20px 20px 6px; overflow:hidden; }
.bg { position:absolute; inset:0; background:url(../bg.jpg) center 30%/cover; filter:saturate(.7) brightness(.9); }
.shade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.78) 0%, rgba(0,0,0,.9) 45%, #000 100%); }
.hero > *:not(.bg):not(.shade) { position:relative; }
.top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
.top img { height:20px; }
.live { display:flex; align-items:center; gap:7px; border:1.5px solid rgba(214,253,59,.55); border-radius:999px; padding:5px 11px; font-size:11.5px; color:rgba(255,255,255,.8); background:rgba(214,253,59,.06); white-space:nowrap; }
.live b { color:#fff; font-weight:700; }
.dot { width:7px; height:7px; border-radius:50%; background:#d6fd3b; box-shadow:0 0 0 3px rgba(214,253,59,.18), 0 0 10px rgba(214,253,59,.7); }
.lockup { margin-top:23px; display:flex; align-items:stretch; gap:10px; font-size:17px; font-weight:700; letter-spacing:-.01em; line-height:1.15; }
.lockup::before { content:""; width:4px; flex:none; border-radius:2px; background:#d6fd3b; }
.lockup span { display:flex; flex-direction:column; gap:3px; }
.lockup small { font-size:11px; font-weight:500; color:rgba(255,255,255,.72); letter-spacing:0; }
.lockup em, h1 em { font-style:normal; color:#d6fd3b; }
h1 { margin-top:12px; font-size:42px; font-weight:500; line-height:1.02; letter-spacing:-.04em; }
h1 em { font-weight:700; }
svg { display:block; margin-top:16px; width:360px; height:auto; overflow:visible; }
</style></head>
<body><div class="hero"><div class="bg"></div><div class="shade"></div>
