<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap"><style>
* { box-sizing:border-box; margin:0; padding:0; }
body { width:600px; background:#000; font-family:"Satoshi",system-ui,sans-serif; color:#fff; }
.hero { position:relative; width:600px; padding:26px 30px 6px; overflow:hidden; }
.bg { position:absolute; inset:0; background:url(../bg.jpg) center 30%/cover; filter:saturate(.7) brightness(.9); }
.shade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.78) 0%, rgba(0,0,0,.9) 45%, #000 100%); }
.hero > *:not(.bg):not(.shade) { position:relative; }
.top { display:flex; justify-content:space-between; align-items:center; height:40px; }
.top img { height:24px; }
.live { display:flex; align-items:center; gap:8px; border:1.5px solid rgba(214,253,59,.55); border-radius:999px; padding:6px 13px; font-size:13.5px; color:rgba(255,255,255,.8); background:rgba(214,253,59,.06); }
.live b { color:#fff; font-weight:700; }
.dot { width:8px; height:8px; border-radius:50%; background:#d6fd3b; box-shadow:0 0 0 4px rgba(214,253,59,.18), 0 0 12px rgba(214,253,59,.7); }
.lockup { margin-top:34px; display:flex; align-items:center; gap:11px; font-size:21px; font-weight:700; letter-spacing:-.01em; }
.lockup::before { content:""; width:4px; height:22px; border-radius:2px; background:#d6fd3b; }
.lockup em, h1 em { font-style:normal; color:#d6fd3b; }
h1 { margin-top:14px; font-size:54px; font-weight:500; line-height:1; letter-spacing:-.04em; }
h1 em { font-weight:700; }
svg { display:block; margin-top:18px; width:540px; height:auto; overflow:visible; }
</style></head>
<body><div class="hero"><div class="bg"></div><div class="shade"></div>
<div class="top"><img src="../logo.png" alt=""><div class="live"><span class="dot"></span>Just launched: <b>fincoursa.com</b></div></div>
<div class="lockup"><span>CMT <em>Level II</em> Question Bank</span></div>
<h1>Make your score<br>a <em>higher high.</em></h1>
<svg viewBox="0 14 936 222" fill="none">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6fd3b" stop-opacity=".22"/><stop offset="1" stop-color="#d6fd3b" stop-opacity="0"/></linearGradient>
    </defs>
    <g stroke="rgba(255,255,255,.07)"><line x1="0" y1="60" x2="936" y2="60"/><line x1="0" y1="130" x2="936" y2="130"/><line x1="0" y1="200" x2="936" y2="200"/></g>
    <path d="M0 214 L70 196 L120 208 L190 170 L250 186 L330 138 L390 156 L470 112 L540 128 L620 86 L690 100 L770 58 L820 66 L900 30 L900 250 L0 250 Z" fill="url(#g)"/>
    <path d="M0 214 L70 196 L120 208 L190 170 L250 186 L330 138 L390 156 L470 112 L540 128 L620 86 L690 100 L770 58 L820 66 L900 30" stroke="#d6fd3b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M120 208 L900 70" stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-dasharray="6 7"/>
    <g font-family="Satoshi, sans-serif" font-size="27" fill="rgba(255,255,255,.62)">
      <circle cx="120" cy="208" r="6" fill="#000" stroke="#fff" stroke-width="2"/><text x="132" y="236">Day one</text>
      <circle cx="390" cy="156" r="6" fill="#000" stroke="#fff" stroke-width="2"/><text x="402" y="184">Higher low</text>
      <circle cx="690" cy="100" r="6" fill="#000" stroke="#fff" stroke-width="2"/><text x="702" y="128">Mock exams</text>
      <circle cx="900" cy="30" r="9" fill="#d6fd3b"/><circle cx="900" cy="30" r="18" fill="#d6fd3b" fill-opacity=".18"/>
      <text x="868" y="36" text-anchor="end" fill="#fff" font-weight="700" font-size="30">Exam day</text>
    </g>
  </svg>
</div></body></html>
